services:
  housing-price-model:
    build:
      context: housing-price-model/build
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
  housing-price-orchestrator:
    build: 
      context: housing-price-orchestrator
      additional_contexts:
        project_root: .
    environment:
      - ENV=${ENV}
    ports:
      - "8000:8000"
    depends_on:
      - housing-price-model
  housing-price-ui:
    build:
      context: housing-price-ui
      additional_contexts:
        project_root: .
    environment:
      - ORCHESTRATOR_URL=http://housing-price-orchestrator:8000
    ports:
      - "8501:8501"
    depends_on:
      - housing-price-orchestrator